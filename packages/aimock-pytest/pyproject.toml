[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aimock-pytest"
version = "0.7.0"
description = "pytest fixtures for aimock — mock LLM APIs, multimedia, MCP, A2A, AG-UI, vector DBs, and more"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
test = ["pytest>=7.0", "openai>=3.26.1,<4", "anthropic>=1.12.1,<2"]

[project.entry-points."pytest11"]
aimock = "aimock_pytest.plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/aimock_pytest"]
