name: PROOF policy Node 22 RPC 540
on:
  push:
    branches: [proof/policy-node22-rpc-540]

permissions:
  contents: read

concurrency:
  group: proof-policy-node22-rpc-540
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout diagnostic control files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: control
          persist-credentials: false
      - name: Checkout immutable policy subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1e47d150f6caddffc8e006fd4bec9d89bed5732a
          path: subject
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.28.2
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.3
      - name: Run bounded immutable-subject diagnostic
        run: ruby control/.github/diagnostics/policy-node22-rpc/probe.rb subject evidence
      - name: Retain bounded diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: policy-node22-rpc-540-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 3
